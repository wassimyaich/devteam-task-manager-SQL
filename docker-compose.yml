version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    restart: always

  devteam-api:
    build: ./DevTeamTaskManager.Api
    container_name: devteam_task_manager_api
    ports:
      - "5074:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DevTeamTaskDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      - sqlserver
    restart: always